name: Build and Test

on:
  pull_request:
    branches:
      - dev
      - master

jobs:
  build:
    runs-on: windows-latest

    permissions: write-all

    # Only when run from the main repo
    if: github.repository == 'Microsoft365DSC/DSCParser'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Modules
        shell: pwsh
        run: |
          Install-PSResource -Name Pester -Scope AllUsers -TrustRepository

      - name: Run Tests
        shell: pwsh
        run: |
          Import-Module './Tests/TestHarness.psm1' -Force

          $results = Invoke-TestHarness -Configuration Release
          Write-TestHarnessSummary -Result $results -Path $env:GITHUB_STEP_SUMMARY

          if ($results.DotNet.Failed -gt 0 -or $results.Pester.FailedCount -gt 0)
          {
              throw "$($results.DotNet.Failed) C# and $($results.Pester.FailedCount) PowerShell test(s) failed"
          }

      - name: Upload Code Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage
          path: |
            CodeCov.xml
            TestResults/coverage.cobertura.xml
            TestResults/DSCParser.Tests.trx
          if-no-files-found: warn
