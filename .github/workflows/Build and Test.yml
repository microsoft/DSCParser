name: Build and Test

on:
  pull_request:
    branches:
      - dev
      - master

jobs:
  build:
    runs-on: windows-latest

    permissions: write-all

    # Only when run from the main repo
    if: github.repository == 'Microsoft365DSC/DSCParser'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        shell: pwsh
        run: |
          dotnet restore ./src/DSCParser.sln

      - name: Build Solution
        shell: pwsh
        run: |
          dotnet build ./src/DSCParser.sln -c Release --no-restore

      - name: Run C# Tests
        shell: pwsh
        run: |
          dotnet test --project ./src/DSCParser.Tests/DSCParser.Tests.csproj -c Release --report-trx --no-build --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Build PowerShell Module
        shell: pwsh
        run: |
          & ./Utilities/Build.ps1 -Configuration Release

      - name: Validate Module Manifest
        shell: pwsh
        run: |
          Test-ModuleManifest -Path ./DSCParser/DSCParser.psd1

      - name: Validate Module Import
        shell: pwsh
        run: |
          Import-Module ./DSCParser/DSCParser.psd1 -Force -ErrorAction Stop
          $exportedFunctions = (Get-Module DSCParser).ExportedFunctions.Keys
          if ($exportedFunctions.Count -eq 0)
          {
              throw "No functions exported from the DSCParser module."
          }
          Write-Host "Exported functions: $($exportedFunctions -join ', ')"

      - name: Validate Class-Based Resource Discovery And Parsing
        shell: pwsh
        run: |
          Import-Module ./DSCParser/DSCParser.psd1 -Force -ErrorAction Stop

          $classBasedModule = Get-Module -ListAvailable |
              Where-Object { $_.ExportedDscResources.Count -gt 0 } |
              Select-Object -First 1

          if ($null -eq $classBasedModule)
          {
              Write-Host "::warning::No class-based DSC resource module installed; skipping class-based validation."
              exit 0
          }

          $resources = @(Get-DscResourceV2 -Module $classBasedModule.Name -ErrorAction Stop)
          if ($resources.Count -eq 0)
          {
              throw "No resources discovered for module '$($classBasedModule.Name)'."
          }

          # Only the names the manifest exports are class-based resources. Discovery also returns the
          # embedded CIM types a class-based resource references, which are not resources themselves,
          # so assert against the exported set rather than everything that came back.
          $exported = [System.Collections.Generic.HashSet[System.String]]::new(
              [System.String[]]$classBasedModule.ExportedDscResources,
              [System.StringComparer]::OrdinalIgnoreCase)

          $classBased = @($resources | Where-Object { $exported.Contains($_.Name) })

          $notClassBased = @($classBased | Where-Object { $_.ImplementationDetail -ne 'ClassBased' })
          if ($notClassBased.Count -gt 0)
          {
              throw "Expected every exported resource to be ClassBased, but $($notClassBased.Count) were not: $(($notClassBased.Name | Select-Object -First 10) -join ', ')"
          }

          $notDiscovered = @($classBasedModule.ExportedDscResources | Where-Object { $_ -notin $classBased.Name })
          if ($notDiscovered.Count -gt 0)
          {
              throw "$($notDiscovered.Count) exported resources were not discovered: $(($notDiscovered | Select-Object -First 10) -join ', ')"
          }

          # Anything reported as ClassBased must be an exported resource, never an embedded CIM type.
          $misclassified = @($resources | Where-Object { $_.ImplementationDetail -eq 'ClassBased' -and -not $exported.Contains($_.Name) })
          if ($misclassified.Count -gt 0)
          {
              throw "$($misclassified.Count) resources are ClassBased but not exported by the module: $(($misclassified.Name | Select-Object -First 10) -join ', ')"
          }

          Write-Host "Validated $($classBased.Count) exported class-based resources ($($resources.Count) discovered in total, $($resources.Count - $classBased.Count) embedded CIM types)."

          $resource = $classBased | Where-Object { $_.Properties.Count -gt 0 } | Select-Object -First 1
          if ($null -eq $resource)
          {
              throw "No class-based resource with properties found in module '$($classBasedModule.Name)'."
          }
          $config = @"
          Configuration Test
          {
              Import-DscResource -ModuleName $($classBasedModule.Name) -ModuleVersion $($classBasedModule.Version)
              Node localhost
              {
                  $($resource.Name) TestInstance
                  {
                      $($resource.Properties[0].Name) = "TestValue"
                  }
              }
          }
          "@

          $parsed = @(ConvertTo-DSCObject -Content $config -ErrorAction Stop)
          if ($parsed.Count -ne 1 -or $parsed[0].ResourceName -ne $resource.Name)
          {
              throw "Failed to parse a class-based configuration for '$($resource.Name)'."
          }

          Write-Host "Class-based discovery and parsing validated against $($classBasedModule.Name) ($($classBased.Count) class-based resources)."

          # Regression where the engine wipes its DSC caches when a Configuration is compiled to MOF.
          # Test against that behavior by simulating a wipe of the engine's caches and asserting that both entry points self-heal.
          $reflection = [DSCParser.PSDSC.DscResourceService].Assembly.GetType('DSCParser.PSDSC.DscClassCacheReflection')
          $reflection.GetMethod('ClearCache').Invoke($null, $null)
          $reflection.GetMethod('ResetDynamicKeywords').Invoke($null, $null)

          $parsed = @(ConvertTo-DSCObject -Content $config -ErrorAction Stop)
          if ($parsed.Count -ne 1 -or $parsed[0].ResourceName -ne $resource.Name)
          {
              throw "ConvertTo-DSCObject did not recover after the engine DSC caches were cleared."
          }

          $resourcesAfterWipe = @(Get-DscResourceV2 -Module $classBasedModule.Name -ErrorAction Stop)
          if ($resourcesAfterWipe.Count -ne $resources.Count)
          {
              throw "Get-DscResourceV2 returned $($resourcesAfterWipe.Count) resources after the engine DSC caches were cleared, expected $($resources.Count)."
          }

          Write-Host "Stale engine cache recovery validated (deterministic wipe)."

          # Same regression through the real trigger with compiling a Configuration to MOF.
          if (Get-Module -ListAvailable -Name PSDesiredStateConfiguration)
          {
              Import-Module PSDesiredStateConfiguration -ErrorAction Stop
              $wipeOutput = Join-Path ([System.IO.Path]::GetTempPath()) 'dscparser-wipe'
              # Compile in this process; even a failing compile wipes the caches.
              try
              {
                  Invoke-Expression "Configuration DscParserWipeTest { Node localhost { } }`nDscParserWipeTest -OutputPath '$wipeOutput'" | Out-Null
              }
              catch
              {
                  throw "Compiling a Configuration after using DSCParser failed: $_"
              }

              $parsed = @(ConvertTo-DSCObject -Content $config -ErrorAction Stop)
              if ($parsed.Count -ne 1 -or $parsed[0].ResourceName -ne $resource.Name)
              {
                  throw "ConvertTo-DSCObject did not recover after a Configuration was compiled to MOF."
              }

              $resourcesAfterCompile = @(Get-DscResourceV2 -Module $classBasedModule.Name -ErrorAction Stop)
              if ($resourcesAfterCompile.Count -ne $resources.Count)
              {
                  throw "Get-DscResourceV2 returned $($resourcesAfterCompile.Count) resources after a MOF compile, expected $($resources.Count)."
              }

              Write-Host "Stale engine cache recovery validated (real MOF compile)."
          }
          else
          {
              Write-Host "::warning::PSDesiredStateConfiguration is not installed; skipping the MOF-compile recovery validation."
          }
